name: Build 1.21.1 NeoForge

on:
  push:
    branches: [ "port/1.21.1-neoforge" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle build --stacktrace
      - name: Dedicated server smoke test
        shell: bash
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          set +e
          timeout 90s gradle runServer --stacktrace > server-smoke.log 2>&1
          set -e
          cat server-smoke.log
          if ! grep -q "Done (" server-smoke.log; then
            echo "Dedicated server did not reach the ready state."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AdvancedTools-1.21.1
          path: build/libs/*.jar
