name: Build 1.21.1 NeoForge

on:
  workflow_dispatch:
    inputs:
      server_smoke_test:
        description: Run dedicated server smoke test
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false
          cache-cleanup: on-success
      - name: Build
        run: gradle build --build-cache --stacktrace
      - name: Dedicated server smoke test
        if: ${{ inputs.server_smoke_test }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          log="$GITHUB_WORKSPACE/server-smoke.log"
          : > "$log"

          setsid gradle runServer --build-cache --stacktrace > "$log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -- -"$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 90); do
            if grep -q "Done (" "$log"; then
              cat "$log"
              echo "Dedicated server reached the ready state."
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log"
              echo "Dedicated server exited before reaching the ready state."
              exit 1
            fi
            sleep 1
          done

          cat "$log"
          echo "Dedicated server did not reach the ready state within 90 seconds."
          exit 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AdvancedTools-1.21.1
          path: build/libs/*.jar
